name: pos-nexisthub

services:
  db:
    image: postgres:16-alpine
    container_name: pos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks:
      - pos_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.posnexisthub.rule=Host(`pos.nexisthub.id`)"
      - "traefik.http.routers.posnexisthub.entrypoints=http"
      - "traefik.http.services.posnexisthub.loadbalancer.server.port=80"
    networks:
      - pos_net
      - coolify

volumes:
  pos_pgdata:

networks:
  pos_net:
    name: pos_network
  coolify:
    external: true
